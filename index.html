<!DOCTYPE html>
<html lang="en">
<head>
   <!-- Vercel Web Analytics Tracking Script -->
  <script defer src="/_vercel/insights/script.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Educare — Online Learning Platform (Phase 1)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('home')">
        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black text-xl shadow">E</div>
        <span class="text-xl font-bold tracking-tight text-slate-900">Educare</span>
        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded">Phase 1 Core</span>
      </div>

      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
        <button onclick="navigate('home')" class="text-slate-600 hover:text-blue-600">Home</button>
        <button onclick="navigate('courses')" class="text-slate-600 hover:text-blue-600">Courses</button>
        <button id="nav-student-btn" onclick="navigate('dashboard')" class="text-slate-600 hover:text-blue-600 font-medium">My Dashboard</button>
        <button id="nav-instructor-btn" onclick="navigate('instructor')" class="hidden text-indigo-600 hover:text-indigo-700 font-semibold">Instructor Studio</button>
        <button id="nav-admin-btn" onclick="navigate('admin')" class="hidden text-amber-600 hover:text-amber-700 font-semibold">Admin Panel</button>
      </nav>

      <div class="flex items-center space-x-3" id="auth-buttons">
        <!-- Injected dynamically -->
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app" class="flex-1">
    <!-- Dynamic views injected here -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-slate-400">Educare — Core LMS • Phase 1 Core Architecture</p>
      <button onclick="resetDemoData()" class="text-slate-500 hover:text-rose-400 underline">Reset Demo State</button>
    </div>
  </footer>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex justify-between items-center pb-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900">Sign In to Educare</h3>
        <button onclick="toggleAuthModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <div class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Switch User Role (1-Click)</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="quickAuth('student')" class="p-2.5 border border-blue-200 bg-blue-50 text-blue-800 rounded-xl text-xs font-medium hover:bg-blue-100 text-left transition">
              <span class="block font-bold">Student</span>
              Jane
            </button>
            <button onclick="quickAuth('instructor')" class="p-2.5 border border-indigo-200 bg-indigo-50 text-indigo-800 rounded-xl text-xs font-medium hover:bg-indigo-100 text-left transition">
              <span class="block font-bold">Instructor</span>
              Prof. Alan
            </button>
            <button onclick="quickAuth('admin')" class="p-2.5 border border-amber-200 bg-amber-50 text-amber-800 rounded-xl text-xs font-medium hover:bg-amber-100 text-left transition">
              <span class="block font-bold">Admin</span>
              System
            </button>
          </div>
        </div>
        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-3 text-xs text-slate-400 uppercase">Or custom user</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Email</label>
          <input type="email" id="auth-email" placeholder="user@educare.local" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <button onclick="handleCustomLogin()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm transition">
          Sign In
        </button>
      </div>
    </div>
  </div>

  <!-- ENROLLMENT MODAL -->
  <div id="payment-modal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="inline-flex items-center gap-2 px-2.5 py-1 bg-emerald-50 border border-emerald-200 rounded text-emerald-800 text-xs font-bold uppercase mb-4">
        <span>✓</span> Student Course Enrollment
      </div>
      <h3 class="text-xl font-bold text-slate-900" id="pay-course-title">Course Title</h3>
      <p class="text-xs text-slate-500 mt-2">
        Enrolling assigns this course to your student profile and unlocks <span class="font-bold text-slate-800">ALL lectures, notes, and quizzes</span>.
      </p>
      <div class="mt-6 space-y-2">
        <button onclick="confirmEnrollment()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-sm shadow flex items-center justify-center gap-2 transition">
          <span>✓</span> Confirm Enrollment
        </button>
        <button onclick="togglePaymentModal(false)" class="w-full py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-medium transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    const RELIABLE_VIDEOS = {
      stream1: "https://vjs.zencdn.net/v/oceans.mp4",
      stream2: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      stream3: "https://www.w3schools.com/html/mov_bbb.mp4"
    };

    const DEFAULT_DATA = {
      currentUser: { email: "student@educare.local", name: "Jane Student", role: "STUDENT" },
      users: [
        { id: "u-1", name: "Jane Student", email: "student@educare.local", role: "STUDENT", active: true },
        { id: "u-2", name: "Prof. Alan Turing", email: "instructor@educare.local", role: "INSTRUCTOR", active: true },
        { id: "u-3", name: "System Admin", email: "admin@educare.local", role: "ADMIN", active: true }
      ],
      courses: [
        {
          id: "c-1",
          slug: "fullstack-mastery",
          title: "Complete Web Engineering & System Architecture",
          instructorId: "instructor@educare.local",
          instructorName: "Prof. Alan Turing",
          shortDescription: "Master modern fullstack development and clean architecture from scratch.",
          description: "Student login grants permanent access to all lectures, section materials, notes, and quizzes.",
          sections: [
            {
              id: "s-1",
              title: "Module 1: Foundations & Architecture",
              lectures: [
                { id: "l-1", title: "1. Welcome & Architecture Blueprint", duration: 46, videoUrl: RELIABLE_VIDEOS.stream1 },
                { id: "l-2", title: "2. Setting Up Zero-Billing Environments", duration: 5, videoUrl: RELIABLE_VIDEOS.stream2 },
                { id: "l-3", title: "3. Relational Modeling & Schema Design", duration: 10, videoUrl: RELIABLE_VIDEOS.stream3 }
              ]
            },
            {
              id: "s-2",
              title: "Module 2: Media Streaming & Security",
              lectures: [
                { id: "l-4", title: "4. HTML5 Video Player & Scrubbing", duration: 46, videoUrl: RELIABLE_VIDEOS.stream1 },
                { id: "l-5", title: "5. Production Deployment Patterns", duration: 5, videoUrl: RELIABLE_VIDEOS.stream2 }
              ]
            }
          ],
          resources: [
            { id: "r-1", title: "Architecture_CheatSheet.pdf", size: "1.8 MB" },
            { id: "r-2", title: "Database_Diagrams.png", size: "850 KB" }
          ],
          quizzes: [
            {
              id: "q-1",
              title: "Module 1 Mastery Assessment",
              passingScore: 70,
              questions: [
                {
                  id: "qq-1",
                  questionText: "Which architecture pattern avoids tight coupling to cloud storage?",
                  options: ["Monolithic hardcoding", "Service Interface Abstraction", "Direct SQL Queries in UI", "FTP hardlinks"],
                  correctAnswerIndex: 1
                },
                {
                  id: "qq-2",
                  questionText: "How does Educare track playback resume positions without billing?",
                  options: ["Paid third-party analytics", "Persistent Local Storage / Database sync", "Firebase Analytics", "Constant polling APIs"],
                  correctAnswerIndex: 1
                }
              ]
            }
          ]
        },
        {
          id: "c-2",
          slug: "postgresql-performance",
          title: "High-Performance PostgreSQL Fundamentals",
          instructorId: "instructor@educare.local",
          instructorName: "Prof. Alan Turing",
          shortDescription: "Master indexing strategies and query execution plans.",
          description: "Complete course on relational indexing and connection management. Student login grants instant access to all lectures.",
          sections: [
            {
              id: "s-3",
              title: "Module 1: Query Planner Mechanics",
              lectures: [
                { id: "l-6", title: "1. B-Tree Indices in Action", duration: 46, videoUrl: RELIABLE_VIDEOS.stream1 },
                { id: "l-7", title: "2. Execution Plans Explained", duration: 5, videoUrl: RELIABLE_VIDEOS.stream2 }
              ]
            }
          ],
          resources: [],
          quizzes: []
        }
      ],
      enrollments: [
        { userId: "student@educare.local", courseId: "c-1", enrolledAt: new Date().toISOString() }
      ],
      progress: {
        "student@educare.local": {
          "l-1": { seconds: 12, completed: false }
        }
      },
      quizAttempts: {
        "student@educare.local": {}
      }
    };

    function loadState() {
      const stored = localStorage.getItem("educare_phase1_v1");
      if (!stored) {
        localStorage.setItem("educare_phase1_v1", JSON.stringify(DEFAULT_DATA));
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
      return JSON.parse(stored);
    }

    function saveState() {
      localStorage.setItem("educare_phase1_v1", JSON.stringify(state));
    }

    function resetDemoData() {
      if (confirm("Reset local database to initial Phase 1 demo state?")) {
        localStorage.removeItem("educare_phase1_v1");
        state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveState();
        navigate('home');
      }
    }

    let state = loadState();
    let currentRoute = 'home';
    let routeParams = {};
    let pendingCheckoutCourse = null;
    let progressTimer = null;
    let localBlobUrl = null;

    /* --- AUTH HANDLERS --- */
    function quickAuth(type) {
      if (type === 'admin') {
        state.currentUser = { email: "admin@educare.local", name: "System Admin", role: "ADMIN" };
      } else if (type === 'instructor') {
        state.currentUser = { email: "instructor@educare.local", name: "Prof. Alan Turing", role: "INSTRUCTOR" };
      } else {
        state.currentUser = { email: "student@educare.local", name: "Jane Student", role: "STUDENT" };
      }
      saveState();
      toggleAuthModal(false);
      renderNav();
      navigate(currentRoute, routeParams);
    }

    function handleCustomLogin() {
      const email = document.getElementById("auth-email").value.trim().toLowerCase();
      if (!email) return;
      let existing = state.users.find(u => u.email === email);
      if (!existing) {
        let role = "STUDENT";
        if (email.includes("admin")) role = "ADMIN";
        else if (email.includes("instructor")) role = "INSTRUCTOR";
        existing = { id: "u-" + Date.now(), name: email.split('@')[0], email, role, active: true };
        state.users.push(existing);
      }
      if (!existing.active) {
        alert("This user account has been deactivated by an Administrator.");
        return;
      }
      state.currentUser = { email: existing.email, name: existing.name, role: existing.role };
      saveState();
      toggleAuthModal(false);
      renderNav();
      navigate(currentRoute, routeParams);
    }

    function logout() {
      state.currentUser = null;
      saveState();
      renderNav();
      navigate('home');
    }

    function toggleAuthModal(show) {
      const modal = document.getElementById("auth-modal");
      modal.classList.toggle("hidden", !show);
      modal.classList.toggle("flex", show);
    }

    function renderNav() {
      const authDiv = document.getElementById("auth-buttons");
      const studentBtn = document.getElementById("nav-student-btn");
      const instructorBtn = document.getElementById("nav-instructor-btn");
      const adminBtn = document.getElementById("nav-admin-btn");

      if (state.currentUser) {
        studentBtn.classList.toggle("hidden", state.currentUser.role !== 'STUDENT');
        instructorBtn.classList.toggle("hidden", state.currentUser.role !== 'INSTRUCTOR');
        adminBtn.classList.toggle("hidden", state.currentUser.role !== 'ADMIN');

        authDiv.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xs bg-slate-100 border border-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-medium">
              ${state.currentUser.name} <span class="font-bold text-blue-600">(${state.currentUser.role})</span>
            </span>
            <button onclick="logout()" class="text-xs font-semibold text-rose-600 hover:text-rose-700">Logout</button>
          </div>
        `;
      } else {
        studentBtn.classList.add("hidden");
        instructorBtn.classList.add("hidden");
        adminBtn.classList.add("hidden");
        authDiv.innerHTML = `
          <button onclick="toggleAuthModal(true)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
            Sign In
          </button>
        `;
      }
      lucide.createIcons();
    }

    /* --- ROUTER --- */
    function navigate(route, params = {}) {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
      currentRoute = route;
      routeParams = params;
      renderNav();

      const app = document.getElementById("app");
      if (route === 'home') app.innerHTML = renderHomeView();
      else if (route === 'courses') app.innerHTML = renderCoursesView();
      else if (route === 'course-detail') app.innerHTML = renderCourseDetailView(params.courseId);
      else if (route === 'learn') app.innerHTML = renderLearnView(params.courseId, params.lectureId);
      else if (route === 'dashboard') app.innerHTML = renderStudentDashboardView();
      else if (route === 'instructor') app.innerHTML = renderInstructorDashboardView();
      else if (route === 'admin') app.innerHTML = renderAdminView();

      window.scrollTo(0, 0);
      lucide.createIcons();
    }

    /* ==========================================================================
       VIEW: HOME (Preserving exact layout & copy)
       ========================================================================== */
    function renderHomeView() {
      return `
        <section class="bg-slate-900 text-white py-20 px-4 text-center">
          <div class="max-w-4xl mx-auto space-y-6">
            <span class="inline-block text-xs uppercase tracking-widest px-3 py-1 bg-emerald-500/20 text-emerald-300 rounded-full border border-emerald-400/30 font-semibold">
              Student-Login Based Access
            </span>
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">
              Transform Your Future. <br><span class="text-blue-400">Empower Your Ambition with Educare.</span>
            </h1>
            <p class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto">
              Access comprehensive, expert-crafted courses designed for real-world mastery. Learn at your own pace with structured video lectures, downloadable guides, and uninterrupted progress tracking.
            </p>
            <div class="flex justify-center gap-4 pt-4">
              <button onclick="navigate('courses')" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition shadow-lg flex items-center gap-2">
                Browse Courses →
              </button>
              ${
                state.currentUser?.role === 'INSTRUCTOR'
                  ? `<button onclick="navigate('instructor')" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition">Instructor Studio</button>`
                  : state.currentUser?.role === 'ADMIN'
                  ? `<button onclick="navigate('admin')" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-xl transition">Admin Panel</button>`
                  : `<button onclick="navigate('dashboard')" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl border border-slate-700 transition">My Dashboard</button>`
              }
            </div>
          </div>
        </section>

        <section class="max-w-7xl mx-auto px-4 py-16">
          <h2 class="text-2xl font-bold text-slate-900 mb-6">Available Courses</h2>
          <div class="grid md:grid-cols-2 gap-6">
            ${state.courses.map(courseCardHtml).join('')}
          </div>
        </section>
      `;
    }

    /* ==========================================================================
       VIEW: COURSES CATALOG
       ========================================================================== */
    function renderCoursesView() {
      return `
        <div class="max-w-7xl mx-auto px-4 py-12">
          <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900">Course Catalog</h1>
            <p class="text-slate-500 text-sm mt-1">Enroll via student login to get lifetime access to all lectures and quizzes.</p>
          </div>
          <div class="grid md:grid-cols-2 gap-6">
            ${state.courses.map(courseCardHtml).join('')}
          </div>
        </div>
      `;
    }

    function courseCardHtml(c) {
      const isEnrolled = state.currentUser && state.enrollments.some(
        e => e.userId === state.currentUser.email && e.courseId === c.id
      );
      const lectureCount = c.sections.reduce((acc, s) => acc + s.lectures.length, 0);

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div class="flex justify-between items-center mb-3">
              ${
                isEnrolled 
                  ? '<span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">✓ Enrolled — All Lessons Unlocked</span>'
                  : '<span class="text-[10px] font-bold uppercase tracking-wider bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">Student Access</span>'
              }
              <span class="text-xs text-slate-400 font-medium">By ${c.instructorName || 'Educare Faculty'}</span>
            </div>
            <h3 class="font-bold text-xl text-slate-900">${c.title}</h3>
            <p class="text-slate-500 text-xs mt-2 leading-relaxed">${c.shortDescription}</p>
            <div class="mt-4 flex items-center gap-3 text-xs text-slate-400">
              <span>${c.sections.length} Modules</span>
              <span>•</span>
              <span>${lectureCount} Lessons</span>
              ${c.quizzes?.length ? `<span>•</span><span class="text-indigo-600 font-semibold">${c.quizzes.length} Quiz</span>` : ''}
            </div>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">Access: Student Login</span>
            ${
              isEnrolled
                ? `<button onclick="startLearning('${c.id}')" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition">
                     Watch Lectures →
                   </button>`
                : `<button onclick="navigate('course-detail', { courseId: '${c.id}' })" class="px-5 py-2.5 bg-slate-900 hover:bg-blue-600 text-white text-xs font-bold rounded-xl transition">
                     View &amp; Enroll
                   </button>`
            }
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       VIEW: COURSE DETAIL
       ========================================================================== */
    function renderCourseDetailView(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return `<div class="p-8">Course not found.</div>`;

      const isEnrolled = state.currentUser && state.enrollments.some(
        e => e.userId === state.currentUser.email && e.courseId === course.id
      );
      const totalLectures = course.sections.reduce((acc, s) => acc + s.lectures.length, 0);

      return `
        <div class="max-w-5xl mx-auto px-4 py-12 space-y-8">
          <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between gap-8">
            <div class="space-y-4 max-w-2xl">
              ${
                isEnrolled 
                  ? '<div class="inline-block text-xs font-bold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">✓ You own this course — All lectures unlocked</div>'
                  : '<div class="inline-block text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-full">Student Access Program</div>'
              }
              <h1 class="text-3xl font-extrabold text-slate-900">${course.title}</h1>
              <p class="text-slate-600 text-sm leading-relaxed">${course.description}</p>
              <div class="text-xs text-slate-500 font-medium flex items-center gap-4">
                <span>Instructor: <strong class="text-slate-700">${course.instructorName}</strong></span>
                <span>•</span>
                <span>${course.sections.length} Modules</span>
                <span>•</span>
                <span>${totalLectures} Video Lessons</span>
              </div>
            </div>

            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center flex flex-col justify-between min-w-[240px]">
              <div>
                <span class="text-[11px] font-bold uppercase text-slate-500">Course Access</span>
                <div class="text-xl font-bold text-slate-900 mt-1">Student Enrollment</div>
                <p class="text-[11px] text-slate-400 mt-1">Includes all ${totalLectures} lessons & quizzes</p>
              </div>
              ${
                isEnrolled
                  ? `<button onclick="startLearning('${course.id}')" class="w-full mt-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl shadow transition">
                       Watch All Lessons →
                     </button>`
                  : `<button onclick="openEnrollmentModal('${course.id}')" class="w-full mt-6 py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl shadow transition">
                       Enroll &amp; Unlock All
                     </button>`
              }
            </div>
          </div>

          <!-- Curriculum breakdown -->
          <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <h2 class="text-xl font-bold text-slate-900">Complete Course Curriculum</h2>
            <div class="space-y-4">
              ${course.sections.map((section, sIdx) => `
                <div class="border border-slate-200 rounded-xl overflow-hidden">
                  <div class="bg-slate-50 px-4 py-3 font-semibold text-xs text-slate-700 flex justify-between">
                    <span>Module ${sIdx + 1}: ${section.title}</span>
                    <span>${section.lectures.length} lessons</span>
                  </div>
                  <div class="divide-y divide-slate-100">
                    ${section.lectures.map(lecture => `
                      <div class="px-4 py-3.5 flex items-center justify-between text-sm hover:bg-slate-50">
                        <div class="flex items-center space-x-3">

    function handleLocalVideoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      localBlobUrl = URL.createObjectURL(file);
      const player = document.getElementById("live-player");
      if (player) {
        player.src = localBlobUrl;
        player.play();
      }
    }

    function initVideoPlayer(lectureId, resumeSeconds) {
      const player = document.getElementById("live-player");
      const toast = document.getElementById("resume-toast");
      const timeStr = document.getElementById("resume-time-str");
      const statusText = document.getElementById("progress-status");
      if (!player) return;

      player.onloadedmetadata = () => {
        if (resumeSeconds > 2) {
          player.currentTime = resumeSeconds;
          if (toast && timeStr) {
            const m = Math.floor(resumeSeconds / 60);
            const s = Math.floor(resumeSeconds % 60);
            timeStr.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 3000);
          }
        }
      };

      function recordProgress() {
        if (!state.currentUser) return;
        const cur = player.currentTime;
        const dur = player.duration || 1;
        const isCompleted = (cur / dur) >= 0.9;

        if (!state.progress[state.currentUser.email]) {
          state.progress[state.currentUser.email] = {};
        }

        const wasCompleted = state.progress[state.currentUser.email][lectureId]?.completed || false;

        state.progress[state.currentUser.email][lectureId] = {
          seconds: Math.floor(cur),
          completed: isCompleted || wasCompleted
        };
        saveState();

        if (statusText) {
          statusText.innerText = (isCompleted || wasCompleted) 
            ? "Completed (100% finished)" 
            : `${Math.round((cur / dur) * 100)}% watched (Auto-saved)`;
        }
      }

      progressTimer = setInterval(() => {
        if (!player.paused) recordProgress();
      }, 3000);

      player.onpause = recordProgress;
      player.onended = () => {
        recordProgress();
        renderNav();
      };
    }

                    <tr>
                      <td class="px-6 py-4">
                        <strong class="text-slate-900 block">${u.name}</strong>
                        <span class="text-slate-400 text-[11px]">${u.email}</span>
                      </td>
                      <td class="px-6 py-4">
                        <select onchange="changeUserRole('${u.id}', this.value)" class="bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-semibold text-slate-700">
                          <option value="STUDENT" ${u.role === 'STUDENT' ? 'selected' : ''}>STUDENT</option>
                          <option value="INSTRUCTOR" ${u.role === 'INSTRUCTOR' ? 'selected' : ''}>INSTRUCTOR</option>
                          <option value="ADMIN" ${u.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
                        </select>
                      </td>
                      <td class="px-6 py-4">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u.active ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                          ${u.active ? 'Active' : 'Disabled'}
                        </span>
                      </td>
                      <td class="px-6 py-4 text-right space-x-2">
                        <button onclick="toggleUserStatus('${u.id}')" class="text-blue-600 font-bold hover:underline">
                          ${u.active ? 'Disable' : 'Enable'}
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       QUIZ MODAL LOGIC (INTERACTIVE ASSESSMENT)
       ========================================================================== */
    function openQuizModal(courseId, quizId) {
      const course = state.courses.find(c => c.id === courseId);
      const quiz = course?.quizzes.find(q => q.id === quizId);
      if (!quiz) return;

      const modalHtml = `
        <div id="active-quiz-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 my-8">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
              <h3 class="text-lg font-bold text-slate-900">${quiz.title}</h3>
              <button onclick="document.getElementById('active-quiz-modal').remove()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="quiz-form" onsubmit="submitQuiz(event, '${courseId}', '${quizId}')" class="mt-4 space-y-6">
              ${quiz.questions.map((q, qIdx) => `
                <div class="space-y-2">
                  <p class="text-sm font-semibold text-slate-800">${qIdx + 1}. ${q.questionText}</p>
                  <div class="space-y-1.5 pl-2">
                    ${q.options.map((opt, optIdx) => `
                      <label class="flex items-center space-x-2 text-xs text-slate-700 cursor-pointer p-2 rounded-lg hover:bg-slate-50 border border-slate-100">
                        <input type="radio" name="question_${qIdx}" value="${optIdx}" required class="accent-indigo-600" />
                        <span>${opt}</span>
                      </label>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
              <div class="pt-4 border-t border-slate-100 flex justify-end gap-2">
                <button type="button" onclick="document.getElementById('active-quiz-modal').remove()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow">Submit Answers</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function submitQuiz(e, courseId, quizId) {
      e.preventDefault();
      const course = state.courses.find(c => c.id === courseId);
      const quiz = course?.quizzes.find(q => q.id === quizId);
      if (!quiz || !state.currentUser) return;

      const formData = new FormData(e.target);
      let correctCount = 0;

      quiz.questions.forEach((q, qIdx) => {
        const selected = parseInt(formData.get(`question_${qIdx}`));
        if (selected === q.correctAnswerIndex) {
          correctCount++;
        }
      });

      const score = Math.round((correctCount / quiz.questions.length) * 100);
      const passed = score >= quiz.passingScore;

      if (!state.quizAttempts[state.currentUser.email]) {
        state.quizAttempts[state.currentUser.email] = {};
      }

      state.quizAttempts[state.currentUser.email][quiz.id] = {
        score,
        passed,
        attemptedAt: new Date().toISOString()
      };
      saveState();

      document.getElementById('active-quiz-modal').remove();
      alert(`Quiz Finished! Your Score: ${score}%\nResult: ${passed ? 'PASSED ✓' : 'FAILED — Needs review'}`);
      navigate('learn', { courseId, lectureId: course.sections[0]?.lectures[0]?.id });
    }

    /* ==========================================================================
       COURSE MANAGEMENT & DATA MUTATIONS
       ========================================================================== */
    function openEnrollmentModal(courseId) {
      if (!state.currentUser) {
        toggleAuthModal(true);
        return;
      }
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;

      pendingCheckoutCourse = course;
      document.getElementById("pay-course-title").innerText = course.title;
      togglePaymentModal(true);
    }

    function togglePaymentModal(show) {
      const modal = document.getElementById("payment-modal");
      modal.classList.toggle("hidden", !show);
      modal.classList.toggle("flex", show);
    }

    function confirmEnrollment() {
      if (!pendingCheckoutCourse || !state.currentUser) return;

      const alreadyEnrolled = state.enrollments.some(
        e => e.userId === state.currentUser.email && e.courseId === pendingCheckoutCourse.id
      );

      if (!alreadyEnrolled) {
        state.enrollments.push({
          userId: state.currentUser.email,
          courseId: pendingCheckoutCourse.id,
          enrolledAt: new Date().toISOString()
        });
        saveState();
      }

      togglePaymentModal(false);
      navigate('dashboard');
    }

    function startLearning(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      const firstLecture = course.sections[0]?.lectures[0];
      if (firstLecture) {
        navigate('learn', { courseId: course.id, lectureId: firstLecture.id });
      }
    }

    function promptCreateCourse() {
      const title = prompt("Enter course title:");
      if (!title) return;
      const desc = prompt("Enter short description:") || "Comprehensive course curriculum.";

      state.courses.unshift({
        id: "c-" + Date.now(),
        slug: title.toLowerCase().replace(/[^a-z0-9]/g, '-'),
        title: title,
        instructorId: state.currentUser.email,
        instructorName: state.currentUser.name,
        shortDescription: desc,
        description: desc,
        sections: [
          {
            id: "s-" + Date.now(),
            title: "Module 1: Orientation",
            lectures: [
              { id: "l-" + Date.now(), title: "1. Welcome Lesson", duration: 46, videoUrl: RELIABLE_VIDEOS.stream1 }
            ]
          }
        ],
        resources: [],
        quizzes: []
      });

      saveState();
      navigate(currentRoute);
    }

    function promptAddSection(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;
      const title = prompt("Enter Module / Section Title:");
      if (!title) return;

      course.sections.push({
        id: "s-" + Date.now(),
        title: title,
        lectures: []
      });
      saveState();
      navigate(currentRoute);
    }

    function promptAddLecture(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course || course.sections.length === 0) return;
      const title = prompt("Enter lesson title:");
      if (!title) return;
      const videoUrl = prompt("Enter video URL (or leave blank for standard demo):") || RELIABLE_VIDEOS.stream1;

      course.sections[0].lectures.push({
        id: "l-" + Date.now(),
        title: title,
        duration: 46,
        videoUrl: videoUrl
      });
      saveState();
      navigate(currentRoute);
    }

    function promptCreateQuiz(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;
      const title = prompt("Enter Assessment Title:", "Module Knowledge Quiz");
      if (!title) return;

      if (!course.quizzes) course.quizzes = [];
      course.quizzes.push({
        id: "q-" + Date.now(),
        title: title,
        passingScore: 70,
        questions: [
          {
            id: "qq-" + Date.now(),
            questionText: "Sample question: Does this lecture require online billing?",
            options: ["Yes, paid billing", "No, it is 100% free Phase 1 LMS", "Requires monthly credit card", "Unsure"],
            correctAnswerIndex: 1
          }
        ]
      });
      saveState();
      navigate(currentRoute);
    }

    function promptAddUser() {
      const name = prompt("User full name:");
      if (!name) return;
      const email = prompt("User email address:");
      if (!email) return;
      const role = prompt("Role (STUDENT, INSTRUCTOR, ADMIN):", "STUDENT").toUpperCase();

      state.users.push({
        id: "u-" + Date.now(),
        name,
        email: email.toLowerCase(),
        role: ["STUDENT", "INSTRUCTOR", "ADMIN"].includes(role) ? role : "STUDENT",
        active: true
      });
      saveState();
      navigate('admin');
    }

    function changeUserRole(userId, newRole) {
      const user = state.users.find(u => u.id === userId);
      if (user) {
        user.role = newRole;
        saveState();
        renderNav();
      }
    }

    function toggleUserStatus(userId) {
      const user = state.users.find(u => u.id === userId);
      if (user) {
        user.active = !user.active;
        saveState();
        navigate('admin');
      }
    }

    window.onload = () => {
      navigate('home');
    };
  </script>
</body>
</html>
