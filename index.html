<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Educare — Online Learning Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('home')">
        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black text-xl shadow">E</div>
        <span class="text-xl font-bold tracking-tight text-slate-900">Educare</span>
        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded">Interactive MVP</span>
      </div>

      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
        <button onclick="navigate('home')" class="text-slate-600 hover:text-blue-600">Home</button>
        <button onclick="navigate('courses')" class="text-slate-600 hover:text-blue-600">Courses</button>
        <button id="nav-dashboard-btn" onclick="navigate('dashboard')" class="text-slate-600 hover:text-blue-600 font-medium">My Dashboard</button>
        <button id="nav-admin-btn" onclick="navigate('admin')" class="hidden text-amber-600 hover:text-amber-700 font-semibold">Admin Panel</button>
      </nav>

      <div class="flex items-center space-x-3" id="auth-buttons">
        <!-- Injected dynamically -->
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app" class="flex-1">
    <!-- Dynamic views injected here -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-slate-400">Educare — Zero-Billing Architecture • Course-Level Lifetime Access</p>
      <button onclick="resetDemoData()" class="text-slate-500 hover:text-rose-400 underline">Reset Local Database</button>
    </div>
  </footer>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex justify-between items-center pb-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900">Sign In to Educare</h3>
        <button onclick="toggleAuthModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <div class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Select User Account</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="quickAuth('student')" class="p-3 border border-blue-200 bg-blue-50 text-blue-800 rounded-xl text-xs font-medium hover:bg-blue-100 text-left transition">
              <span class="block font-bold text-sm">Jane (Student)</span>
              student@educare.local
            </button>
            <button onclick="quickAuth('admin')" class="p-3 border border-amber-200 bg-amber-50 text-amber-800 rounded-xl text-xs font-medium hover:bg-amber-100 text-left transition">
              <span class="block font-bold text-sm">System Admin</span>
              admin@educare.local
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MOCK CHECKOUT MODAL (Course-Level Only) -->
  <div id="payment-modal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="inline-flex items-center gap-2 px-2.5 py-1 bg-amber-50 border border-amber-200 rounded text-amber-800 text-xs font-bold uppercase mb-4">
        <span>⚠</span> Course-Level Sandbox Checkout
      </div>
      <h3 class="text-xl font-bold text-slate-900" id="pay-course-title">Course Title</h3>
      <p class="text-xs text-slate-500 mt-1">
        Enrolling unlocks <span class="font-bold text-slate-800">ALL lectures and resources</span> in this course. You never pay per video.
      </p>
      <div class="my-5 p-4 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center">
        <span class="text-sm text-slate-600">Total Course Fee:</span>
        <span class="text-2xl font-black text-blue-600" id="pay-course-price">₹0</span>
      </div>
      <div class="space-y-2">
        <button onclick="confirmMockPayment()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-sm shadow flex items-center justify-center gap-2 transition">
          <span>✓</span> Pay Once &amp; Unlock Entire Course
        </button>
        <button onclick="togglePaymentModal(false)" class="w-full py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-medium transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ==========================================================================
       1. RELIABLE VIDEO CDNs (With zero ISP / file:// protocol blockings)
       ========================================================================== */
    const RELIABLE_VIDEOS = {
      stream1: "https://vjs.zencdn.net/v/oceans.mp4",
      stream2: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      stream3: "https://www.w3schools.com/html/mov_bbb.mp4"
    };

    const DEFAULT_DATA = {
      // Default: Logged in as Jane Student
      currentUser: { email: "student@educare.local", name: "Jane Student", role: "STUDENT" },
      courses: [
        {
          id: "c-1",
          slug: "fullstack-mastery",
          title: "Complete Web Engineering & System Architecture",
          shortDescription: "Master modern fullstack development from scratch.",
          description: "One single enrollment grants permanent access to all 5 lectures, section materials, and notes. No lecture fees ever.",
          price: 4999, // ONE-TIME COURSE PRICE
          sections: [
            {
              id: "s-1",
              title: "Module 1: Foundations & Architecture",
              lectures: [
                { id: "l-1", title: "1. Welcome & Architecture Blueprint", duration: 46, videoUrl: RELIABLE_VIDEOS.stream1 },
                { id: "l-2", title: "2. Setting Up Zero-Billing Environments", duration: 5, videoUrl: RELIABLE_VIDEOS.stream2 },
                { id: "l-3", title: "3. Relational Modeling & Schema Design", duration: 10, videoUrl: RELIABLE_VIDEOS.stream3 }
              ]
            },
            {
              id: "s-2",
              title: "Module 2: Media Streaming & Security",
              lectures: [
                { id: "l-4", title: "4. HTML5 Video Player & Scrubbing", duration: 46, videoUrl: RELIABLE_VIDEOS.stream1 },
                { id: "l-5", title: "5. Production Deployment Patterns", duration: 5, videoUrl: RELIABLE_VIDEOS.stream2 }
              ]
            }
          ],
          resources: [
            { id: "r-1", title: "Architecture_CheatSheet.pdf", size: "1.8 MB" },
            { id: "r-2", title: "Database_Diagrams.png", size: "850 KB" }
          ]
        },
        {
          id: "c-2",
          slug: "postgresql-performance",
          title: "High-Performance PostgreSQL Fundamentals",
          shortDescription: "Master indexing strategies and query execution plans.",
          description: "Complete course on relational indexing and connection management. Enrolling grants instant access to all lectures.",
          price: 3499,
          sections: [
            {
              id: "s-3",
              title: "Module 1: Query Planner Mechanics",
              lectures: [
                { id: "l-6", title: "1. B-Tree Indices in Action", duration: 46, videoUrl: RELIABLE_VIDEOS.stream1 },
                { id: "l-7", title: "2. Execution Plans Explained", duration: 5, videoUrl: RELIABLE_VIDEOS.stream2 }
              ]
            }
          ],
          resources: []
        }
      ],
      // Jane is PRE-ENROLLED in Course 1:
      enrollments: [
        { userId: "student@educare.local", courseId: "c-1", enrolledAt: new Date().toISOString() }
      ],
      progress: {
        "student@educare.local": {
          "l-1": { seconds: 12, completed: false }
        }
      }
    };

    /* ==========================================================================
       2. DATABASE STATE MANAGEMENT
       ========================================================================== */
    function loadState() {
      const stored = localStorage.getItem("educare_demo_v3");
      if (!stored) {
        localStorage.setItem("educare_demo_v3", JSON.stringify(DEFAULT_DATA));
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
      return JSON.parse(stored);
    }

    function saveState() {
      localStorage.setItem("educare_demo_v3", JSON.stringify(state));
    }

    function resetDemoData() {
      if (confirm("Reset local database to initial demo state?")) {
        localStorage.removeItem("educare_demo_v3");
        state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveState();
        navigate('dashboard');
      }
    }

    let state = loadState();
    let currentRoute = 'dashboard';
    let routeParams = {};
    let pendingCheckoutCourse = null;
    let progressTimer = null;
    let localBlobUrl = null;

    /* ==========================================================================
       3. AUTHENTICATION (STUDENT VS ADMIN)
       ========================================================================== */
    function quickAuth(type) {
      if (type === 'admin') {
        state.currentUser = { email: "admin@educare.local", name: "System Admin", role: "ADMIN" };
      } else {
        state.currentUser = { email: "student@educare.local", name: "Jane Student", role: "STUDENT" };
      }
      saveState();
      toggleAuthModal(false);
      renderNav();
      navigate(currentRoute, routeParams);
    }

    function logout() {
      state.currentUser = null;
      saveState();
      renderNav();
      navigate('home');
    }

    function toggleAuthModal(show) {
      const modal = document.getElementById("auth-modal");
      modal.classList.toggle("hidden", !show);
      modal.classList.toggle("flex", show);
    }

    function renderNav() {
      const authDiv = document.getElementById("auth-buttons");
      const dashBtn = document.getElementById("nav-dashboard-btn");
      const adminBtn = document.getElementById("nav-admin-btn");

      if (state.currentUser) {
        dashBtn.classList.remove("hidden");
        if (state.currentUser.role === 'ADMIN') {
          adminBtn.classList.remove("hidden");
        } else {
          adminBtn.classList.add("hidden");
        }
        authDiv.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xs bg-slate-100 border border-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-medium">
              ${state.currentUser.name} <span class="font-bold text-blue-600">(${state.currentUser.role})</span>
            </span>
            <button onclick="logout()" class="text-xs font-semibold text-rose-600 hover:text-rose-700">Logout</button>
          </div>
        `;
      } else {
        dashBtn.classList.add("hidden");
        adminBtn.classList.add("hidden");
        authDiv.innerHTML = `
          <button onclick="toggleAuthModal(true)" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
            Sign In
          </button>
        `;
      }
      lucide.createIcons();
    }

    /* ==========================================================================
       4. ROUTER & VIEWS
       ========================================================================== */
    function navigate(route, params = {}) {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
      currentRoute = route;
      routeParams = params;
      renderNav();

      const app = document.getElementById("app");
      if (route === 'home') app.innerHTML = renderHomeView();
      else if (route === 'courses') app.innerHTML = renderCoursesView();
      else if (route === 'course-detail') app.innerHTML = renderCourseDetailView(params.courseId);
      else if (route === 'learn') app.innerHTML = renderLearnView(params.courseId, params.lectureId);
      else if (route === 'dashboard') app.innerHTML = renderDashboardView();
      else if (route === 'admin') app.innerHTML = renderAdminView();

      window.scrollTo(0, 0);
      lucide.createIcons();
    }

    /* --- HOME VIEW --- */
    function renderHomeView() {
      return `
        <section class="bg-slate-900 text-white py-20 px-4 text-center">
          <div class="max-w-4xl mx-auto space-y-6">
            <span class="inline-block text-xs uppercase tracking-widest px-3 py-1 bg-emerald-500/20 text-emerald-300 rounded-full border border-emerald-400/30 font-semibold">
              Course-Level Access • No Per-Lecture Fees
            </span>
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">
              Learn Without Friction. <br><span class="text-blue-400">One Enrollment Unlocks Everything.</span>
            </h1>
            <p class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto">
              When a student logs in and enrolls in a course, every single lecture, resource, and video is unlocked automatically.
            </p>
            <div class="flex justify-center gap-4 pt-4">
              <button onclick="navigate('dashboard')" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition shadow-lg flex items-center gap-2">
                Open Student Dashboard →
              </button>
              <button onclick="navigate('courses')" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl border border-slate-700 transition">
                Browse Courses
              </button>
            </div>
          </div>
        </section>

        <section class="max-w-7xl mx-auto px-4 py-16">
          <h2 class="text-2xl font-bold text-slate-900 mb-6">Available Courses</h2>
          <div class="grid md:grid-cols-2 gap-6">
            ${state.courses.map(courseCardHtml).join('')}
          </div>
        </section>
      `;
    }

    /* --- COURSES CATALOG --- */
    function renderCoursesView() {
      return `
        <div class="max-w-7xl mx-auto px-4 py-12">
          <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900">Course Catalog</h1>
            <p class="text-slate-500 text-sm mt-1">Enroll once per course to get lifetime access to all lectures.</p>
          </div>
          <div class="grid md:grid-cols-2 gap-6">
            ${state.courses.map(courseCardHtml).join('')}
          </div>
        </div>
      `;
    }

    function courseCardHtml(c) {
      const isEnrolled = state.currentUser && state.enrollments.some(
        e => e.userId === state.currentUser.email && e.courseId === c.id
      );
      const lectureCount = c.sections.reduce((acc, s) => acc + s.lectures.length, 0);

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div class="flex justify-between items-center mb-3">
              ${
                isEnrolled 
                  ? '<span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">✓ Enrolled — All Lectures Unlocked</span>'
                  : '<span class="text-[10px] font-bold uppercase tracking-wider bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">Course Enrollment</span>'
              }
              <span class="text-xs text-slate-400">${lectureCount} Total Lessons</span>
            </div>
            <h3 class="font-bold text-xl text-slate-900">${c.title}</h3>
            <p class="text-slate-500 text-xs mt-2 leading-relaxed">${c.shortDescription}</p>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
            <div>
              <span class="text-xs text-slate-400 block font-medium">One-Time Fee:</span>
              <span class="text-xl font-black text-slate-900">₹${c.price}</span>
            </div>
            ${
              isEnrolled
                ? `<button onclick="startLearning('${c.id}')" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition">
                     Watch Lectures →
                   </button>`
                : `<button onclick="navigate('course-detail', { courseId: '${c.id}' })" class="px-5 py-2.5 bg-slate-900 hover:bg-blue-600 text-white text-xs font-bold rounded-xl transition">
                     View &amp; Enroll
                   </button>`
            }
          </div>
        </div>
      `;
    }

    /* --- COURSE DETAIL VIEW --- */
    function renderCourseDetailView(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return `<div class="p-8">Course not found.</div>`;

      const isEnrolled = state.currentUser && state.enrollments.some(
        e => e.userId === state.currentUser.email && e.courseId === course.id
      );

      const totalLectures = course.sections.reduce((acc, s) => acc + s.lectures.length, 0);

      return `
        <div class="max-w-5xl mx-auto px-4 py-12 space-y-8">
          <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between gap-8">
            <div class="space-y-4 max-w-2xl">
              ${
                isEnrolled 
                  ? '<div class="inline-block text-xs font-bold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">✓ You own this course — All lectures unlocked</div>'
                  : '<div class="inline-block text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-full">Full Lifetime Course Package</div>'
              }
              <h1 class="text-3xl font-extrabold text-slate-900">${course.title}</h1>
              <p class="text-slate-600 text-sm leading-relaxed">${course.description}</p>
              <div class="text-xs text-slate-500 font-medium">
                Includes ${course.sections.length} Modules • ${totalLectures} Video Lectures • Downloadable PDFs
              </div>
            </div>

            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center flex flex-col justify-between min-w-[240px]">
              <div>
                <span class="text-[11px] font-bold uppercase text-slate-500">Course Price</span>
                <div class="text-3xl font-black text-slate-900 mt-1">₹${course.price}</div>
                <p class="text-[11px] text-slate-400 mt-1">Single fee for all ${totalLectures} videos</p>
              </div>
              ${
                isEnrolled
                  ? `<button onclick="startLearning('${course.id}')" class="w-full mt-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl shadow transition">
                       Watch All Lessons →
                     </button>`
                  : `<button onclick="openMockPayment('${course.id}')" class="w-full mt-6 py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl shadow transition">
                       Enroll &amp; Unlock All
                     </button>`
              }
            </div>
          </div>

          <!-- Curriculum breakdown (NO per-lecture price) -->
          <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <h2 class="text-xl font-bold text-slate-900">Complete Course Curriculum</h2>
            <div class="space-y-4">
              ${course.sections.map((section, sIdx) => `
                <div class="border border-slate-200 rounded-xl overflow-hidden">
                  <div class="bg-slate-50 px-4 py-3 font-semibold text-xs text-slate-700 flex justify-between">
                    <span>Section ${sIdx + 1}: ${section.title}</span>
                    <span>${section.lectures.length} lessons</span>
                  </div>
                  <div class="divide-y divide-slate-100">
                    ${section.lectures.map(lecture => `
                      <div class="px-4 py-3.5 flex items-center justify-between text-sm hover:bg-slate-50">
                        <div class="flex items-center space-x-3">
                          <i data-lucide="${isEnrolled ? 'play-circle' : 'lock'}" class="w-4 h-4 ${isEnrolled ? 'text-emerald-600' : 'text-slate-400'}"></i>
                          <span class="${isEnrolled ? 'text-slate-800 font-medium' : 'text-slate-500'}">${lecture.title}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                          <span class="text-xs text-slate-400 font-mono">${lecture.duration}s</span>
                          ${isEnrolled ? `<button onclick="navigate('learn', { courseId: '${course.id}', lectureId: '${lecture.id}' })" class="px-3 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-bold rounded transition">Play</button>` : ''}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /* --- LEARNING PLAYER VIEW --- */
    function renderLearnView(courseId, lectureId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return `<div class="p-8">Course not found.</div>`;

      const isEnrolled = state.currentUser && state.enrollments.some(
        e => e.userId === state.currentUser.email && e.courseId === course.id
      );
      const isAdmin = state.currentUser && state.currentUser.role === 'ADMIN';

      // Security check: Must be enrolled in this course or admin
      if (!isEnrolled && !isAdmin) {
        return `
          <div class="max-w-md mx-auto my-20 p-8 bg-white border border-slate-200 rounded-2xl text-center space-y-4 shadow-sm">
            <i data-lucide="lock" class="w-10 h-10 text-amber-500 mx-auto"></i>
            <h2 class="text-xl font-bold">Course Enrollment Required</h2>
            <p class="text-slate-500 text-xs">Enroll in this course once to unlock all lectures.</p>
            <button onclick="navigate('course-detail', { courseId: '${course.id}' })" class="px-5 py-2.5 bg-blue-600 text-white text-xs font-bold rounded-xl">
              Go to Course Enrollment Page
            </button>
          </div>
        `;
      }

      const allLectures = course.sections.flatMap(s => s.lectures);
      const activeLecture = allLectures.find(l => l.id === lectureId) || allLectures[0];

      let savedSeconds = 0;
      if (state.currentUser && state.progress[state.currentUser.email]?.[activeLecture.id]) {
        savedSeconds = state.progress[state.currentUser.email][activeLecture.id].seconds || 0;
      }

      const currentIndex = allLectures.findIndex(l => l.id === activeLecture.id);
      const prevLecture = allLectures[currentIndex - 1];
      const nextLecture = allLectures[currentIndex + 1];

      // Schedule video init
      setTimeout(() => initVideoPlayer(activeLecture.id, savedSeconds), 60);

      const videoSource = localBlobUrl || activeLecture.videoUrl;

      return `
        <div class="bg-slate-950 text-slate-100 min-h-[calc(100vh-4rem)] flex flex-col lg:flex-row">
          <!-- Main Player Pane -->
          <div class="flex-1 p-4 lg:p-8 overflow-y-auto">
            <div class="max-w-4xl mx-auto space-y-6">

              <!-- Video Container -->
              <div class="relative bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl aspect-video">
                <video 
                  id="live-player" 
                  src="${videoSource}" 
                  controls 
                  playsinline 
                  preload="auto" 
                  class="w-full h-full object-contain"
                ></video>
                <div id="resume-toast" class="absolute top-4 left-4 bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow hidden">
                  Resumed at <span id="resume-time-str">00:00</span>
                </div>
              </div>

              <!-- Option to test any local file instantly -->
              <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs text-slate-400">
                <span>Want to test your own video file?</span>
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-medium border border-slate-700">
                  📁 Load Local MP4 File
                  <input type="file" accept="video/mp4,video/*" class="hidden" onchange="handleLocalVideoUpload(event)" />
                </label>
              </div>

              <!-- Lecture Info -->
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-5">
                <div>
                  <div class="text-xs text-emerald-400 font-semibold uppercase tracking-wider flex items-center gap-1">
                    <span>✓ Enrolled Access:</span> ${course.title}
                  </div>
                  <h1 class="text-2xl font-bold text-white mt-1">${activeLecture.title}</h1>
                  <p class="text-xs text-slate-400 mt-1" id="progress-status">Tracking progress automatically...</p>
                </div>
                <div class="flex items-center space-x-2">
                  ${prevLecture ? `<button onclick="navigate('learn', { courseId: '${course.id}', lectureId: '${prevLecture.id}' })" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg">← Previous</button>` : ''}
                  ${nextLecture ? `<button onclick="navigate('learn', { courseId: '${course.id}', lectureId: '${nextLecture.id}' })" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg">Next Lesson →</button>` : ''}
                </div>
              </div>

              <!-- Attached Lesson Resources -->
              ${course.resources.length > 0 ? `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                  <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Downloadable Study Materials</h3>
                  <div class="grid sm:grid-cols-2 gap-3">
                    ${course.resources.map(r => `
                      <div class="flex items-center justify-between p-3 bg-slate-800/40 rounded-lg border border-slate-700/40 text-xs">
                        <span class="font-medium text-slate-200">${r.title}</span>
                        <button onclick="alert('Download simulated for: ${r.title}')" class="text-blue-400 hover:underline">Download (${r.size})</button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Syllabus Sidebar (ALL UNLOCKED) -->
          <div class="w-full lg:w-80 bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 p-4 overflow-y-auto">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">All Course Lessons</h2>
            <div class="space-y-4">
              ${course.sections.map(s => `
                <div class="space-y-1">
                  <div class="text-[11px] font-bold text-slate-400 uppercase px-2 py-1">${s.title}</div>
                  ${s.lectures.map(l => {
                    const isCurrent = l.id === activeLecture.id;
                    const isCompleted = state.currentUser && state.progress[state.currentUser.email]?.[l.id]?.completed;
                    return `
                      <button onclick="navigate('learn', { courseId: '${course.id}', lectureId: '${l.id}' })" class="w-full text-left p-2.5 rounded-lg text-xs flex items-center justify-between ${isCurrent ? 'bg-blue-600 text-white font-bold' : 'hover:bg-slate-800 text-slate-300'} transition">
                        <div class="flex items-center space-x-2 truncate">
                          <i data-lucide="${isCompleted ? 'check-circle' : 'play'}" class="w-3.5 h-3.5 shrink-0 ${isCompleted ? 'text-emerald-400' : 'text-slate-400'}"></i>
                          <span class="truncate">${l.title}</span>
                        </div>
                        <span class="text-[10px] text-slate-400 font-mono">${l.duration}s</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function handleLocalVideoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      localBlobUrl = URL.createObjectURL(file);
      const player = document.getElementById("live-player");
      if (player) {
        player.src = localBlobUrl;
        player.play();
      }
    }

    function initVideoPlayer(lectureId, resumeSeconds) {
      const player = document.getElementById("live-player");
      const toast = document.getElementById("resume-toast");
      const timeStr = document.getElementById("resume-time-str");
      const statusText = document.getElementById("progress-status");
      if (!player) return;

      player.onloadedmetadata = () => {
        if (resumeSeconds > 2) {
          player.currentTime = resumeSeconds;
          if (toast && timeStr) {
            const m = Math.floor(resumeSeconds / 60);
            const s = Math.floor(resumeSeconds % 60);
            timeStr.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 3000);
          }
        }
      };

      function recordProgress() {
        if (!state.currentUser) return;
        const cur = player.currentTime;
        const dur = player.duration || 1;
        const isCompleted = (cur / dur) >= 0.9;

        if (!state.progress[state.currentUser.email]) {
          state.progress[state.currentUser.email] = {};
        }

        const wasCompleted = state.progress[state.currentUser.email][lectureId]?.completed || false;

        state.progress[state.currentUser.email][lectureId] = {
          seconds: Math.floor(cur),
          completed: isCompleted || wasCompleted
        };
        saveState();

        if (statusText) {
          statusText.innerText = (isCompleted || wasCompleted) 
            ? "Completed (100% finished)" 
            : `${Math.round((cur / dur) * 100)}% watched (Saved)`;
        }
      }

      progressTimer = setInterval(() => {
        if (!player.paused) recordProgress();
      }, 3000);

      player.onpause = recordProgress;
      player.onended = () => {
        recordProgress();
        renderNav();
      };
    }

    /* --- STUDENT DASHBOARD --- */
    function renderDashboardView() {
      if (!state.currentUser) {
        return `
          <div class="max-w-md mx-auto my-20 p-8 bg-white border border-slate-200 rounded-2xl text-center space-y-4 shadow-sm">
            <h2 class="text-xl font-bold">Please Sign In</h2>
            <button onclick="toggleAuthModal(true)" class="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-lg">Sign In</button>
          </div>
        `;
      }

      const userEnrollments = state.enrollments.filter(e => e.userId === state.currentUser.email);
      const enrolledCourses = state.courses.filter(c => userEnrollments.some(e => e.courseId === c.id));
      const userProgress = state.progress[state.currentUser.email] || {};

      return `
        <div class="max-w-7xl mx-auto px-4 py-12 space-y-8">
          <div>
            <span class="text-xs uppercase font-bold text-emerald-600 tracking-wider">Student Learning Portal</span>
            <h1 class="text-3xl font-extrabold text-slate-900 mt-1">Welcome back, ${state.currentUser.name}</h1>
            <p class="text-slate-500 text-sm mt-1">Here are your enrolled courses. Click "Watch All Lectures" to play any video.</p>
          </div>

          <div class="grid md:grid-cols-2 gap-6">
            ${enrolledCourses.map(course => {
              const lectures = course.sections.flatMap(s => s.lectures);
              const total = lectures.length;
              const completed = lectures.filter(l => userProgress[l.id]?.completed).length;
              const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
              const nextLecture = lectures.find(l => !userProgress[l.id]?.completed) || lectures[0];

              return `
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-center">
                      <span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded">All Lessons Unlocked</span>
                      <span class="text-xs font-bold text-slate-900">${pct}% Done</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-900 mt-3">${course.title}</h3>
                    <p class="text-slate-500 text-xs mt-1 leading-relaxed">${course.shortDescription}</p>

                    <div class="mt-6 space-y-2">
                      <div class="flex justify-between text-xs text-slate-600 font-medium">
                        <span>${completed} of ${total} Lessons Completed</span>
                      </div>
                      <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-600 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
                      </div>
                    </div>
                  </div>

                  <button onclick="navigate('learn', { courseId: '${course.id}', lectureId: '${nextLecture?.id}' })" class="w-full mt-6 py-3 bg-slate-900 hover:bg-blue-600 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-4 h-4 fill-current"></i> Watch All Lectures →
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    /* --- ADMIN VIEW --- */
    function renderAdminView() {
      if (!state.currentUser || state.currentUser.role !== 'ADMIN') {
        return `<div class="p-12 text-center text-rose-600 font-bold">Access Denied. Admin account required.</div>`;
      }

      return `
        <div class="max-w-7xl mx-auto px-4 py-12 space-y-8">
          <div>
            <h1 class="text-3xl font-extrabold text-slate-900">Admin Course Management</h1>
            <p class="text-slate-500 text-xs mt-1">Courses are purchased as complete packages. No per-lecture billing.</p>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 font-bold text-sm text-slate-800">
              Active Courses
            </div>
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 uppercase text-[10px] text-slate-500 font-bold">
                <tr>
                  <th class="px-6 py-3">Course Title</th>
                  <th class="px-6 py-3">Total Lectures</th>
                  <th class="px-6 py-3">Course Price (One-Time)</th>
                  <th class="px-6 py-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.courses.map(c => `
                  <tr>
                    <td class="px-6 py-4 font-bold text-slate-900">${c.title}</td>
                    <td class="px-6 py-4">${c.sections.reduce((a, s) => a + s.lectures.length, 0)} Lectures</td>
                    <td class="px-6 py-4 font-bold text-slate-800">₹${c.price}</td>
                    <td class="px-6 py-4 text-right">
                      <button onclick="startLearning('${c.id}')" class="text-blue-600 font-bold hover:underline">Preview Course Player</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       5. PAYMENT & ENROLLMENT LOGIC
       ========================================================================== */
    function openMockPayment(courseId) {
      if (!state.currentUser) {
        toggleAuthModal(true);
        return;
      }
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;

      pendingCheckoutCourse = course;
      document.getElementById("pay-course-title").innerText = course.title;
      document.getElementById("pay-course-price").innerText = `₹${course.price}`;
      togglePaymentModal(true);
    }

    function togglePaymentModal(show) {
      const modal = document.getElementById("payment-modal");
      modal.classList.toggle("hidden", !show);
      modal.classList.toggle("flex", show);
    }

    function confirmMockPayment() {
      if (!pendingCheckoutCourse || !state.currentUser) return;

      const alreadyEnrolled = state.enrollments.some(
        e => e.userId === state.currentUser.email && e.courseId === pendingCheckoutCourse.id
      );

      if (!alreadyEnrolled) {
        state.enrollments.push({
          userId: state.currentUser.email,
          courseId: pendingCheckoutCourse.id,
          enrolledAt: new Date().toISOString()
        });
        saveState();
      }

      togglePaymentModal(false);
      navigate('dashboard');
    }

    function startLearning(courseId) {
      const course = state.courses.find(c => c.id === courseId);
      const firstLecture = course.sections[0]?.lectures[0];
      if (firstLecture) {
        navigate('learn', { courseId: course.id, lectureId: firstLecture.id });
      }
    }

    /* ==========================================================================
       6. BOOTSTRAP
       ========================================================================== */
    window.onload = () => {
      navigate('dashboard');
    };
  </script>
</body>
</html>
